name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Ensure assets folder exists
        run: mkdir -p assets/images

      - name: Fix project Android config
        run: |
          python3 << 'PY'
          from pathlib import Path

          def write(path, text):
              lines = text.splitlines()
              cleaned = []
              for line in lines:
                  if line.startswith("    "):
                      cleaned.append(line[4:])
                  else:
                      cleaned.append(line)
              Path(path).write_text("\n".join(cleaned).lstrip("\n") + "\n", encoding="utf-8")
              print(f"Wrote {path}")

          write("android/app/build.gradle", """
              plugins {
                  id "com.android.application"
                  id "kotlin-android"
                  id "dev.flutter.flutter-gradle-plugin"
              }

              android {
                  namespace = "com.loanagent.app"
                  compileSdk = 35
                  ndkVersion = flutter.ndkVersion

                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  kotlinOptions {
                      jvmTarget = "17"
                  }

                  defaultConfig {
                      applicationId = "com.loanagent.app"
                      minSdk = 23
                      targetSdk = 35
                      versionCode = flutter.versionCode
                      versionName = flutter.versionName
                  }

                  buildTypes {
                      release {
                          signingConfig = signingConfigs.debug
                      }
                  }
              }

              flutter {
                  source = "../.."
              }

              dependencies {}
          """)

          write("android/settings.gradle", """
              pluginManagement {
                  def flutterSdkPath = {
                      def properties = new Properties()
                      file("local.properties").withInputStream { properties.load(it) }
                      def flutterSdkPath = properties.getProperty("flutter.sdk")
                      assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                      return flutterSdkPath
                  }()

                  includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }

              plugins {
                  id "dev.flutter.flutter-plugin-loader" version "1.0.0"
                  id "com.android.application" version "8.3.0" apply false
                  id "org.jetbrains.kotlin.android" version "1.9.22" apply false
              }

              include ":app"
          """)

          write("android/build.gradle", """
              allprojects {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }

              rootProject.buildDir = "../build"
              subprojects {
                  project.buildDir = "${rootProject.buildDir}/${project.name}"
              }
              subprojects {
                  project.evaluationDependsOn(":app")
              }

              tasks.register("clean", Delete) {
                  delete rootProject.buildDir
              }
          """)

          write("android/gradle.properties", """
              org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
              android.useAndroidX=true
              android.enableJetifier=true
          """)

          print("Project Android config fixed.")
          print("--- gradle.properties ---")
          print(Path("android/gradle.properties").read_text())
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugin build.gradle files
        run: |
          find "$HOME/.pub-cache" -type f -path "*/android/build.gradle" 2>/dev/null | while read -r f; do
            if grep -q "flutter\." "$f" 2>/dev/null; then
              echo "Patching: $f"
              sed -i \
                -e 's/flutter\.compileSdkVersion/35/g' \
                -e 's/flutter\.minSdkVersion/23/g' \
                -e 's/flutter\.targetSdkVersion/35/g' \
                -e 's/flutter\.ndkVersion/"27.0.12077973"/g' \
                "$f" || true
            fi
          done
          echo "Plugin patches applied."

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
