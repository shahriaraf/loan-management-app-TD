name: loan_agent_app
description: Field Agent App for Loan Management System - Customer onboarding, loan origination, verification & collections.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State & Navigation
  provider: ^6.1.2
  go_router: ^14.6.2
  # Networking
  dio: ^5.7.0
  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  # UI & Utils
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  # Media
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  # Location
  geolocator: ^13.0.2
  # Utils
  uuid: ^4.5.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  flutter_spinkit: ^5.2.1
  another_flushbar: ^1.12.30

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
